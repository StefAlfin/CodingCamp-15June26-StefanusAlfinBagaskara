<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ───────────── HEADER / GREETING ───────────── -->
  <header class="header">
    <div class="header-left">
      <div id="datetime" class="datetime"></div>
      <h1 id="greeting" class="greeting"></h1>
    </div>
    <div class="header-right">
      <button id="themeToggle" class="btn btn-icon" title="Toggle dark mode">🌙</button>
      <button id="openSettings" class="btn btn-icon" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- ───────────── MAIN GRID ───────────── -->
  <main class="grid">

    <!-- POMODORO TIMER -->
    <section class="card" id="timerCard">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="startBtn">Start</button>
        <button class="btn btn-secondary" id="stopBtn">Stop</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
      <div class="timer-config">
        <label for="pomodoroInput">Duration (min):</label>
        <input type="number" id="pomodoroInput" min="1" max="120" value="25" />
        <button class="btn btn-sm" id="applyTimer">Apply</button>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card" id="todoCard">
      <h2 class="card-title">To-Do List</h2>
      <div class="todo-add">
        <input type="text" id="todoInput" placeholder="Add a new task…" maxlength="120" />
        <button class="btn btn-primary" id="addTodo">Add</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </section>

    <!-- QUICK LINKS -->
    <section class="card" id="linksCard">
      <h2 class="card-title">Quick Links</h2>
      <div class="links-add">
        <input type="text" id="linkName" placeholder="Name" maxlength="30" />
        <input type="url" id="linkUrl" placeholder="https://…" />
        <button class="btn btn-primary" id="addLink">Add</button>
      </div>
      <div class="links-grid" id="linksGrid"></div>
    </section>

  </main>

  <!-- ───────────── SETTINGS MODAL ───────────── -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <h2>Settings</h2>
      <label for="customName">Your Name</label>
      <input type="text" id="customName" placeholder="Enter your name" maxlength="40" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveName">Save</button>
        <button class="btn btn-secondary" id="closeSettings">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
